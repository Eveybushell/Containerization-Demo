name: lightweight-web-stack

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-node-app:stable
    env_file:
      - .env
    environment:
      - PORT=${APP_PORT}
    # Maps a range of host ports to the application port, allowing multiple replicas 
    # to spin up without port collisions on the host machine.
    ports:
      - "${WEB_PORT_RANGE}:${APP_PORT}"
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.25'      # Max CPU limit per replica
          memory: 128M      # Max RAM limit per replica
        reservations:
          cpus: '0.05'
          memory: 64M
    # Compose-level health check enforcement
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${APP_PORT}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s